# ============================================================================
# Redirects from the old WordPress URLs to their new equivalents.
#
# Google still holds most of this site ranking authority on the old addresses.
# Without these rules every one of those results leads to a 404, which loses
# the visitor and eventually the ranking too.
#
# Netlify applies rules top to bottom and stops at the first match, so the
# specific rules come before the wildcards.
#
# Years are written out explicitly rather than using a :year placeholder.
# Netlify placeholders match ANY single path segment, so /:year/ would also
# have swallowed /about/ and /contact/.
# ============================================================================

# --- Send the temporary Netlify address to the official domain -------------
[[redirects]]
  from = "https://ibeju-lekki.netlify.app/*"
  to = "https://ibejulekki.lg.gov.ng/:splat"
  status = 301
  force = true

